version: '3.9'

# Dev override: only spins up infra; run app with `npm run dev`
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: koireader_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data

volumes:
  postgres_dev_data:
  redis_dev_data:
